name: Release

# Push a version tag on main to release, e.g.:
#   git tag v0.3.2 && git push origin v0.3.2
# The tag must match package.json's version and point at a commit on main.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for Marketplace trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

env:
  VSCE_VERSION: 4.1.0
  OVSX_VERSION: 1.3.0

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Settings → Environments → "release" can require an approval before publishing.
    # The Marketplace trusted-publishing policy only accepts this workflow file
    # (release.yml) in this environment, so keep both names in sync with it.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag, version and branch
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main. Merge the release PR first, then tag main."
            exit 1
          fi
          node scripts/release-notes.js "${VERSION}" > release-notes.md
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

      - name: Package VSIX
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" package --no-git-tag-version --out "codelens-graph-${{ steps.version.outputs.version }}.vsix"
      - name: Check package contents
        run: node scripts/check-vsix.js "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      # Trusted publishing: no stored token. The Marketplace exchanges this run's
      # GitHub OIDC token, accepted only for Pranayd555/codelens-graph,
      # release.yml and the "release" environment (publisher PranayDas →
      # Trusted Publishing on marketplace.visualstudio.com/manage).
      - name: Publish to the VS Code Marketplace
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --oidc --packagePath "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      # Trusted publishing on Open VSX too: the registry exchanges the same kind
      # of OIDC token, registered for PranayDas.codelens-graph with this repo,
      # release.yml and the "release" environment (open-vsx.org → Settings →
      # Trusted Publishers).
      - name: Publish to Open VSX
        run: npx --yes "ovsx@${OVSX_VERSION}" publish --trusted-publishing --packagePath "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "codelens-graph-${{ steps.version.outputs.version }}.vsix" \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
