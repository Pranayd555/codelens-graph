name: Release

# Push a version tag on main to release, e.g.:
#   git tag v0.3.2 && git push origin v0.3.2
# The tag must match package.json's version and point at a commit on main.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

env:
  VSCE_VERSION: 4.1.0
  OVSX_VERSION: 1.3.0

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Settings → Environments → "release" can require an approval before publishing.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag, version and branch
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main. Merge the release PR first, then tag main."
            exit 1
          fi
          node scripts/release-notes.js "${VERSION}" > release-notes.md
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

      - name: Package VSIX
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" package --no-git-tag-version --out "codelens-graph-${{ steps.version.outputs.version }}.vsix"
      - name: Check package contents
        run: node scripts/check-vsix.js "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then echo "::warning::VSCE_PAT is not set — skipped the Marketplace"; exit 0; fi
          npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --packagePath "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then echo "::warning::OVSX_PAT is not set — skipped Open VSX"; exit 0; fi
          npx --yes "ovsx@${OVSX_VERSION}" publish "codelens-graph-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "codelens-graph-${{ steps.version.outputs.version }}.vsix" \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
