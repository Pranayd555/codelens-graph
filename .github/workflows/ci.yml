name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VSCE_VERSION: 4.1.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Path handling differs on Windows (separators, case-insensitive paths),
        # so every change is tested on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests with coverage
        shell: bash   # bash -eo pipefail, so a failing run isn't masked by tee
        run: npm run test:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //' | cut -c1-60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package VSIX
        run: npx --yes @vscode/vsce@${{ env.VSCE_VERSION }} package --no-git-tag-version --out codelens-graph.vsix
      - name: Check package contents
        run: node scripts/check-vsix.js codelens-graph.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: codelens-graph-vsix
          path: codelens-graph.vsix
          retention-days: 14
