name: Bug report
description: Something in CodeLens Graph doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/Pranayd555/codelens-graph/issues) first.
        For security problems, don't open an issue — see [SECURITY.md](https://github.com/Pranayd555/codelens-graph/blob/dev/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal example helps a lot — e.g. a couple of small source files and what you did.
      placeholder: |
        1. Open a folder containing …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodeLens Graph version
      description: Extensions view → CodeLens Graph.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      multiple: true
      options: [VS Code, VS Code Insiders, Cursor, Windsurf, Antigravity, Other]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent (if the problem involves the MCP server)
      multiple: true
      options: [Claude Code, Copilot, Cursor, Windsurf (Cascade), Antigravity, Other, Not related to an agent]
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Languages in the project
      placeholder: "TypeScript, Python"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Help → Toggle Developer Tools → Console, filtered by "[CodeLens". Remove anything private.
      render: text
